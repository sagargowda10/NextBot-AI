apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextbot-backend
  namespace: nextbot
  labels: { app: nextbot-backend }
spec:
  replicas: 2
  selector: { matchLabels: { app: nextbot-backend } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata:
      labels: { app: nextbot-backend }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: backend
          image: ghcr.io/OWNER/nextbot-backend:latest
          ports: [{ containerPort: 8000, name: http }]
          envFrom:
            - configMapRef: { name: nextbot-config }
            - secretRef: { name: nextbot-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: nextbot-backend
  namespace: nextbot
spec:
  selector: { app: nextbot-backend }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nextbot-backend
  namespace: nextbot
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nextbot-backend }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# One-off schema migration, run before each rollout (CI: kubectl apply -f migrate-job.yaml)
apiVersion: batch/v1
kind: Job
metadata:
  name: nextbot-migrate
  namespace: nextbot
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/OWNER/nextbot-backend:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: nextbot-config }
            - secretRef: { name: nextbot-secrets }
