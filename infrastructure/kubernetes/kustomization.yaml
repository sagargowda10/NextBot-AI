apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nextbot
resources:
  - namespace.yaml
  - configmap.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
# secret.template.yaml is intentionally excluded — create the real Secret out-of-band.
images:
  - { name: ghcr.io/OWNER/nextbot-backend, newTag: latest }
  - { name: ghcr.io/OWNER/nextbot-frontend, newTag: latest }
