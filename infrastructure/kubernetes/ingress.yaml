# AWS Load Balancer Controller (ALB). Swap annotations for ingress-nginx if preferred.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextbot
  namespace: nextbot
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:ACCOUNT:certificate/ID
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: nextbot-frontend, port: { number: 80 } } } }
    - host: api.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: nextbot-backend, port: { number: 80 } } } }
