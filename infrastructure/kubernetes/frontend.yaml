apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextbot-frontend
  namespace: nextbot
  labels: { app: nextbot-frontend }
spec:
  replicas: 2
  selector: { matchLabels: { app: nextbot-frontend } }
  template:
    metadata:
      labels: { app: nextbot-frontend }
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: frontend
          image: ghcr.io/OWNER/nextbot-frontend:latest  # built with NEXT_PUBLIC_API_URL=https://api.example.com
          ports: [{ containerPort: 3000, name: http }]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: nextbot-frontend
  namespace: nextbot
spec:
  selector: { app: nextbot-frontend }
  ports: [{ name: http, port: 80, targetPort: http }]
