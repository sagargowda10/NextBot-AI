# Lightweight setup: backend on SQLite with in-memory cache and event bus + frontend. No other services.
#   docker compose -f docker-compose.dev.yml up --build
name: nextbot-dev

services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: local
      DEMO_MODE: "true"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      PAYMENT_PROVIDER: mock
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      DATABASE_URL: sqlite+aiosqlite:////data/nextbot.db
      EVENT_BUS: memory
      JWT_SECRET: local-dev-only-secret-change-me-0123456789
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes: [sqlitedata:/data]
    user: "0:0"  # writable volume for the SQLite file
    ports: ["8000:8000"]

  frontend:
    build: { context: ./frontend, args: { BACKEND_INTERNAL_URL: "http://backend:8000" } }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes: { sqlitedata: {} }
