# Full infrastructure: PostgreSQL+pgvector, Redis, MongoDB, Kafka (KRaft), backend, frontend, Prometheus, Grafana.
#   docker compose up --build
# Optional OpenSearch product index:  docker compose --profile search up --build
# Lightweight alternative (SQLite, in-memory bus): docker compose -f docker-compose.dev.yml up --build
name: nextbot

x-backend-env: &backend-env
  ENVIRONMENT: local
  DEMO_MODE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
  EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
  DATABASE_URL: postgresql+asyncpg://nextbot:nextbot@postgres:5432/nextbot
  REDIS_URL: redis://redis:6379/0
  MONGO_URL: mongodb://mongo:27017
  EVENT_BUS: kafka
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-secret-change-me-0123456789}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-dev-webhook-secret}
  CORS_ORIGINS: '["http://localhost:3000"]'
  MCP_ALLOWED_HOSTS: '["localhost:*","127.0.0.1:*","backend:*"]'
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: nextbot, POSTGRES_PASSWORD: nextbot, POSTGRES_DB: nextbot }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nextbot"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  mongo:
    image: mongo:7
    volumes: [mongodata:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"], interval: 10s, timeout: 5s, retries: 20 }

  kafka:
    image: apache/kafka:3.8.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.1
    depends_on: { kafka: { condition: service_healthy } }
    volumes: [./infrastructure/kafka/create-topics.sh:/create-topics.sh:ro]
    entrypoint: ["sh", "/create-topics.sh"]
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    profiles: [search]
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]

  backend:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    ports: ["3000:3000"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: [./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["9090:9090"]
    depends_on: [backend]

  grafana:
    image: grafana/grafana:11.3.1
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}", GF_AUTH_ANONYMOUS_ENABLED: "true" }
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

volumes: { pgdata: {}, redisdata: {}, mongodata: {}, kafkadata: {} }
