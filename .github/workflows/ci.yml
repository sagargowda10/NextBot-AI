name: CI

# Runs on every push to main, every pull request, and on demand (Actions tab -> CI -> Run workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      AI_PROVIDER: mock          # tests never call paid AI providers
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Type-check (mypy)
        run: mypy app

      - name: Unit tests (agents, plugins, RAG, MCP, events, n8n, research, resilience)
        run: pytest tests/unit -q --junitxml=../reports/backend-unit.xml

      - name: Integration tests (FastAPI + SQLite, PostgreSQL/pgvector via Testcontainers)
        run: pytest tests/integration -q -rs --junitxml=../reports/backend-integration.xml

      - name: Migrations apply cleanly
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci.db"
        run: alembic upgrade head

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: reports/*.xml

      - name: Job summary
        if: always()
        working-directory: .
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          print("### Backend test results\n\n| Suite | Tests | Failures | Errors | Skipped |\n|---|---|---|---|---|")
          for f in sorted(glob.glob("reports/*.xml")):
              r = ET.parse(f).getroot()
              s = r if r.tag == "testsuite" else r.find("testsuite")
              print(f"| {f.split('/')[-1][:-4]} | {s.get('tests')} | {s.get('failures')} | {s.get('errors')} | {s.get('skipped')} |")
          PY

  frontend:
    name: Frontend (type-check, lint, production build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  webhook:
    name: GitHub webhook receiver (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/github-webhook
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - name: Signature, ping, push, workflow_run and duplicate-delivery tests
        run: pytest -q

  e2e:
    name: End-to-end (Docker stack + Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Start the demo stack (SQLite, mock AI/payments)
        run: docker compose -f docker-compose.dev.yml up -d --build

      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health/ready && exit 0
            sleep 3
          done
          echo "backend did not become ready"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright tests
        working-directory: frontend
        env:
          E2E_NO_SERVER: "1"
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

      - name: Backend logs
        if: always()
        run: docker compose -f docker-compose.dev.yml logs backend | tail -200

  images:
    name: Publish Docker images (main only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nextbot-backend:${{ github.sha }}

      - name: Frontend image (same-origin /api proxy; no API URL baked in)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/nextbot-frontend:${{ github.sha }}
